worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 기본 보안 헤더
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 서버 버전 숨기기
    server_tokens off;

    # 업로드 크기 제한 (FIT 파일 보통 1-5MB)
    client_max_body_size 10M;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # HTTP → HTTPS 리다이렉트
    server {
        listen 80;
        server_name yourdomain.com;  # ← 실제 도메인으로 변경

        # Let's Encrypt ACME 챌린지 (certbot webroot 방식)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 메인 서버
    server {
        listen 443 ssl;
        http2 on;
        server_name yourdomain.com;  # ← 실제 도메인으로 변경

        # SSL 인증서 경로 (Let's Encrypt: /etc/letsencrypt/live/yourdomain.com/)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # 권장 SSL 설정
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # SyncNb 앱으로 프록시
        location / {
            proxy_pass         http://syncnb:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 동기화 작업이 오래 걸릴 수 있으므로 타임아웃 충분히
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
