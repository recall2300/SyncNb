<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncNb — 관리자 패널</title>
  <script>
    (function(){
      var t = localStorage.getItem('syncnb-theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', t || (d ? 'dark' : 'light'));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
</head>
<body>

<header>
  <a href="/" class="back-link">← SyncNb</a>
  <h1>관리자 패널</h1>
  <div class="header-right">
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">☽</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-header">
      <h2>사용자 관리</h2>
      <button class="btn btn-secondary btn-sm" onclick="loadUsers()">새로고침</button>
    </div>
    <div id="users-wrap">
      <div id="loading">불러오는 중...</div>
    </div>
  </div>
</main>

<!-- Edit User Modal -->
<dialog id="edit-modal">
  <div class="modal-body">
    <h3>사용자 편집</h3>
    <div class="modal-sub" id="edit-username-label"></div>
    <div class="field">
      <label for="edit-pw">새 비밀번호</label>
      <input type="password" id="edit-pw" placeholder="비워두면 변경 안함" />
    </div>
    <label class="checkbox-row">
      <input type="checkbox" id="edit-admin" />
      관리자 권한 부여
    </label>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('edit-modal').close()">취소</button>
      <button class="btn btn-primary" id="edit-save-btn" onclick="saveEdit()">저장</button>
    </div>
    <div class="modal-error" id="edit-error"></div>
  </div>
</dialog>

<div id="toast"></div>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
