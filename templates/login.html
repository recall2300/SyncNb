<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncNb — 로그인</title>
  <script>
    (function(){
      var t = localStorage.getItem('syncnb-theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', t || (d ? 'dark' : 'light'));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body>

  <button class="login-theme-btn" id="theme-btn" onclick="toggleTheme()">☽</button>

  <div class="card">
    <div class="logo">
      <h1>Sync<span>Nb</span></h1>
      <p>Garmin → Strava Sync</p>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-login"    onclick="switchTab('login')">로그인</div>
      <div class="tab"        id="tab-register" onclick="switchTab('register')">회원가입</div>
    </div>

    <div id="form-login">
      <div class="field">
        <label for="login-user">아이디</label>
        <input type="text" id="login-user" placeholder="아이디 입력" autocomplete="username" />
      </div>
      <div class="field">
        <label for="login-pass">비밀번호</label>
        <input type="password" id="login-pass" placeholder="비밀번호 입력" autocomplete="current-password" />
      </div>
      <button class="btn" id="login-btn" onclick="doLogin()">로그인</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <div id="form-register" style="display:none;">
      <div class="field">
        <label for="reg-user">아이디 (3자 이상)</label>
        <input type="text" id="reg-user" placeholder="아이디 입력" autocomplete="username" />
      </div>
      <div class="field">
        <label for="reg-pass">비밀번호 (8자 이상)</label>
        <input type="password" id="reg-pass" placeholder="비밀번호 입력" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="reg-pass2">비밀번호 확인</label>
        <input type="password" id="reg-pass2" placeholder="비밀번호 재입력" autocomplete="new-password" />
      </div>
      <button class="btn" id="reg-btn" onclick="doRegister()">회원가입</button>
      <div class="error-msg" id="reg-error"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
