<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncNb</title>
  <script>
    (function(){
      var t = localStorage.getItem('syncnb-theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', t || (d ? 'dark' : 'light'));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
</head>
<body>

<header>
  <h1>SyncNb</h1>
  <span class="header-subtitle">Garmin → Strava</span>
  <div class="header-badges">
    <span id="garmin-badge" class="badge disconnected" onclick="handleGarminClick()">
      <span class="dot off" id="garmin-dot"></span>
      <span id="garmin-label">Garmin</span>
    </span>
    <span id="strava-badge" class="badge disconnected" onclick="handleStravaClick()">
      <span class="dot off" id="strava-dot"></span>
      <span id="strava-label">Strava</span>
    </span>
  </div>
  <div class="header-right">
    <a href="/admin" id="admin-link" class="admin-link" style="display:none;">Admin</a>
    <button class="icon-btn" id="profile-btn" onclick="openProfileModal()" title="설정">⚙</button>
    <button class="btn-ghost" onclick="doLogout()">로그아웃</button>
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">☽</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-header">
      <h2>최근 러닝 활동</h2>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn btn-secondary btn-sm" onclick="loadActivities(false)">새로고침</button>
        <button id="sync-btn" class="btn btn-primary btn-sm" onclick="syncSelected()" disabled>Strava에 업로드</button>
      </div>
    </div>

    <div id="progress-wrap" class="progress-wrap" style="display:none;">
      <div class="progress-track">
        <div class="progress-rail">
          <div id="progress-bar"></div>
        </div>
        <span id="progress-text"></span>
      </div>
    </div>

    <div id="table-wrap">
      <div id="empty-msg">Garmin에 로그인하면 러닝 활동이 표시됩니다.</div>
    </div>
  </div>
</main>

<!-- Garmin Login Modal -->
<dialog id="garmin-modal">
  <div class="modal-body">
    <h3 id="modal-title">Garmin 로그인</h3>
    <div id="modal-login-form">
      <div class="field">
        <label for="g-email">이메일</label>
        <input type="email" id="g-email" placeholder="garmin@example.com" autocomplete="username" />
      </div>
      <div class="field">
        <label for="g-password">비밀번호</label>
        <input type="password" id="g-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeGarminModal()">취소</button>
        <button class="btn btn-primary" id="login-btn" onclick="submitGarminLogin()">로그인</button>
      </div>
    </div>
    <div id="modal-mfa-form" style="display:none;">
      <p style="font-size:0.82rem;color:var(--text-3);margin-bottom:16px;font-family:var(--mono);">
        2단계 인증 코드를 입력해주세요.
      </p>
      <div class="field">
        <label for="g-mfa">인증 코드</label>
        <input type="text" id="g-mfa" placeholder="123456" inputmode="numeric" maxlength="8" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeGarminModal()">취소</button>
        <button class="btn btn-primary" id="mfa-btn" onclick="submitMfa()">확인</button>
      </div>
    </div>
    <div class="modal-error" id="modal-error"></div>
  </div>
</dialog>

<!-- Profile / Password Modal -->
<dialog id="profile-modal">
  <div class="modal-body">
    <h3>설정</h3>
    <div class="section-title">자동 동기화</div>
    <div class="autosync-row">
      <div>
        <div class="autosync-desc">새 러닝 활동이 Garmin에 기록되면<br>자동으로 Strava에 업로드합니다. (2분 간격)</div>
        <div class="autosync-note" id="autosync-note"></div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="autosync-toggle" onchange="handleAutoSync(this)">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <hr class="divider" />
    <div class="field">
      <label>아이디</label>
      <input type="text" id="profile-username" disabled />
    </div>
    <hr class="divider" />
    <div class="section-title">비밀번호 변경</div>
    <div class="field">
      <label for="pw-current">현재 비밀번호</label>
      <input type="password" id="pw-current" placeholder="현재 비밀번호 입력" autocomplete="current-password" />
    </div>
    <div class="field">
      <label for="pw-new">새 비밀번호 (8자 이상)</label>
      <input type="password" id="pw-new" placeholder="새 비밀번호 입력" autocomplete="new-password" />
    </div>
    <div class="field">
      <label for="pw-new2">새 비밀번호 확인</label>
      <input type="password" id="pw-new2" placeholder="새 비밀번호 재입력" autocomplete="new-password" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('profile-modal').close()">닫기</button>
      <button class="btn btn-primary" id="pw-btn" onclick="changePassword()">변경</button>
    </div>
    <div class="modal-error" id="pw-error"></div>
  </div>
</dialog>

<!-- Activity Detail Modal -->
<dialog id="detail-modal">
  <div id="detail-inner"></div>
</dialog>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
